name: Build debug APKs

# Builds installable debug APKs for the phone and watch on GitHub's servers,
# so they can be installed without a local Android toolchain. Runs on pushes to
# the dev branches and on demand, and publishes the APKs to a rolling prerelease.

on:
  push:
    branches:
      - "ccr-f57e1c8e-dnp3wk"
      - "claude/fervent-lovelace-dl6h7k"
    paths: [ "pixel-flipper-companion/**", ".github/workflows/android-build.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the action's default package set (it tries the obsolete "tools"
          # package, which no longer exists and fails the step).
          packages: ""

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Each branch publishes to its own prerelease, so a build from a feature
      # branch cannot replace the APKs a known-good branch published.
      - name: Pick a release channel
        id: channel
        run: |
          if [ "$GITHUB_REF_NAME" = "ccr-f57e1c8e-dnp3wk" ]; then
            echo "tag=debug-latest" >> "$GITHUB_OUTPUT"
          else
            slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '/_' '--' | tr -cd '[:alnum:]-')
            echo "tag=debug-$slug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APKs
        working-directory: pixel-flipper-companion
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      # The signing certificate is printed on every build so signature drift is
      # visible here rather than surfacing as INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # on a phone. These digests come from the committed debug.keystore and
      # should be identical on every run; if they change, the keystore did.
      - name: Report APK signing certificates
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in \
            pixel-flipper-companion/mobile/build/outputs/apk/debug/mobile-debug.apk \
            pixel-flipper-companion/wear/build/outputs/apk/debug/wear-debug.apk ; do
            echo "== $(basename "$apk")"
            "$apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest"
          done

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            pixel-flipper-companion/mobile/build/outputs/apk/debug/mobile-debug.apk
            pixel-flipper-companion/wear/build/outputs/apk/debug/wear-debug.apk

      - name: Publish to a rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          cd pixel-flipper-companion
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" \
            mobile/build/outputs/apk/debug/mobile-debug.apk \
            wear/build/outputs/apk/debug/wear-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Pixel Flipper Companion - $GITHUB_REF_NAME" \
            --notes "Debug APKs from $GITHUB_REF_NAME. Install mobile-debug.apk on a phone, wear-debug.apk on a Wear OS watch. Debug builds - allow installing from your browser/files app when prompted."

      # Tests run last so a failure can never block the APK from publishing.
      - name: Run unit tests
        working-directory: pixel-flipper-companion
        run: >
          ./gradlew
          :mobile:testDebugUnitTest
          :shared:testDebugUnitTest
          :wear:testDebugUnitTest
          --no-daemon
