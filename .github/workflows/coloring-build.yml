name: Build Coloring APK

# Builds the kids coloring app and publishes an installable APK to the
# "coloring-latest" prerelease, so it can be sideloaded without a local toolchain.

on:
  push:
    branches: [ "ccr-f57e1c8e-dnp3wk" ]
    paths: [ "kids-coloring/**", ".github/workflows/coloring-build.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: kids-coloring
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK clearly
        working-directory: kids-coloring
        run: cp app/build/outputs/apk/debug/app-debug.apk coloring-debug.apk

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coloring-apk
          path: kids-coloring/coloring-debug.apk

      - name: Publish to a rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd kids-coloring
          gh release delete coloring-latest --cleanup-tag --yes || true
          gh release create coloring-latest coloring-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Coloring Fun - latest debug build" \
            --notes "Original, ad-free children's coloring app. Install coloring-debug.apk on a phone; allow installing from your browser/files app when prompted."

      - name: Run unit tests
        working-directory: kids-coloring
        run: ./gradlew :app:testDebugUnitTest --no-daemon
